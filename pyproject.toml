[project]
name = "natural-language-flow-rag"
version = "0.4.0-dev.13"
description = "Natural-language-flow and English-prosody retrieval for the BADGR local AI stack"
requires-python = ">=3.12"
license = { text = "Proprietary — BADGRTechnologies LLC" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is used deliberately in invariant checks

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
