# natural-language-flow-rag — runtime configuration
#
# Values marked VERIFIED were MEASURED on this host during the read-only audit
# of 2026-07-31 (see /home/t0n34781/workspace/natural-flow-rag-audit.md).
# Values marked DEFAULT are provisional and must be settled by measurement.

project:
  name: natural-language-flow-rag
  owner: BADGRTechnologies LLC
  root: /home/t0n34781/projects/natural-language-flow-rag   # A1 APPROVED

collection:
  name: badgr_natural_flow_v1        # VERIFIED collision-free across all 5 Chroma stores
  backend: chroma
  persistence_path: ./var/chroma     # A2 — deliberately NOT badgr_harness/rag_db
  space: cosine                      # VERIFIED — matches existing 768-d collections
  allowlisted_collections:
    - badgr_natural_flow_v1
    - badgr_natural_flow_feedback_v1

embedding:
  provider: ollama
  endpoint: http://127.0.0.1:11434   # VERIFIED reachable
  model: nomic-embed-text
  model_tag: "nomic-embed-text:latest"
  model_digest: "0a109f422b47"       # VERIFIED — asserted at startup
  vector_dimension: 768              # VERIFIED — MEASURED, not quoted
  model_context_tokens: 2048         # VERIFIED — hard truncation ceiling
  normalize_vectors: false           # VERIFIED — Ollama returns L2 norm 1.000000
  forbid_mixed_models: true
  assert_dimension_on_startup: true
  explicit_embeddings_only: true     # never pass query_texts= (audit hazard B2)
  batch_size: 16
  timeout_seconds: 120

chunking:
  # A4 UNANSWERED. cl100k_base is GPT tokenization, NOT nomic-bert's — counts are
  # approximate. Recorded per-chunk so a later switch is detectable, and the caps
  # below carry margin rather than trusting exactness.
  tokenizer: cl100k_base
  hard_maximum_tokens: 2048          # absolute refuse — model ceiling
  safe_target_ceiling: 1024          # margin against tokenizer approximation
  default:
    strategy: recursive_token
    target_tokens: 512
    overlap_tokens: 64
    minimum_tokens: 80
    maximum_tokens: 640
  profiles:
    reference:
      target_tokens: 512
      overlap_tokens: 64
    transcript:
      target_tokens: 384
      overlap_tokens: 48
      preserve_speaker_turns: true
    approved_example:
      target_tokens: 256
      overlap_tokens: 0
      maximum_tokens: 512          # a single approved example is never split
      never_merge_separate_examples: true
      example_separator: heading   # MEASURED: blank_line split these documents
                                   # into 23-token fragments (125 chunks from
                                   # one 1,512-word file). One example per H2
                                   # section or horizontal rule.
    glossary:
      # MEASURED 2026-08-01: the approved_example profile (target 256) split the
      # 19 glossary sections into 34 chunks, cutting definitions in half — the
      # `break index` entry lost its 0-to-4 scale to a chunk boundary. A glossary
      # entry answers a lookup or it is useless, so the target is raised to hold
      # the largest entry (`break index`, 414 tokens) whole, with margin.
      target_tokens: 512
      overlap_tokens: 0
      maximum_tokens: 768            # refuses rather than splits a definition
      never_merge_separate_examples: true
      example_separator: heading     # one entry per H2 term
    pronunciation:                   # CMUdict entries — one record per line
      target_tokens: 256
      overlap_tokens: 0
      never_merge_separate_examples: true

retrieval:
  dense_candidates: 24
  lexical_candidates: 24
  fusion:
    method: reciprocal_rank_fusion
    rrf_k: 60
  rerank:
    enabled: false                   # DEFERRED — ~3.98 GiB VRAM, 2.14 GB already held
    candidates: 12
  final_chunks: 5
  maximum_context_tokens: 2048
  maximum_chunks_per_document: 3
  neighbor_chunks: 1
  deduplicate: true
  # A8 — MEASURED, then deliberately left disabled (Prompt C §9 and §12 both
  # permit this with a documented reason).
  #
  # Over the 15 evaluation queries the top-5 cosine distances span 0.114–0.426,
  # i.e. similarity 0.574–0.886, and every one of those results was a useful hit.
  # There is no separation to cut on: any floor below 0.574 excludes nothing and
  # any floor above it starts discarding correct answers. A threshold fitted to
  # 15 queries against a 48-chunk single-topic collection would be overfitted,
  # and `_apply_floor` filters the dense arm only, so it would silently change
  # RRF input rather than final output.
  #
  # Revisit when the collection carries genuinely off-topic material — a second
  # register, or roughly 300+ chunks — and re-measure the distance distribution
  # for known-irrelevant queries before choosing a value.
  similarity_floor: null

  # Prompt D: negative-pattern material may be returned ONLY when the request
  # explicitly asks what to avoid. Enforced as a default metadata filter rather
  # than as advice, so a rewrite request cannot cite rejected delivery as
  # positive guidance. MEASURED: without this, EVAL-009 ("why does this sound
  # difficult when read aloud") pulled the negative chunk into a rewrite result.
  exclude_doc_types_by_default: [negative_pattern]

  # Probe-shaped material must not outrank the material that answers it.
  # MEASURED 2026-08-01: the query "ToBI" ranked the EVAL-004 chunk first and the
  # glossary's ToBI definition second, because EVAL-004 is an evaluation prompt —
  # short, and almost entirely composed of the probe terms, which is the shape
  # BM25 scores highest. Demotion is a stable partition, not a filter: the
  # evaluation cases stay in the result and keep their order among themselves,
  # because they carry pass criteria that EVAL-005 through EVAL-007 legitimately
  # need. They simply stop leading.
  demote_doc_types: [evaluation_case]
  contrast_intent_patterns:
    - avoid
    - robotic
    - mechanical
    - what not to
    - should not
    - reject
    - rejected
    - contrast
    - negative
    - wrong with
    - sounds bad
    - too flat
    - monotone
    - over-enunciat

evaluation:
  test_overlap_values:   [0, 32, 64]
  test_reference_sizes:  [384, 512, 768]
  test_transcript_sizes: [256, 384, 512]
  metrics: [recall_at_5, mrr, exact_term_recall, latency_p50, latency_p95]
  exact_term_probes:
    - "ToBI"
    - "H*"
    - "L-L%"
    - "break index"
    - "intonational phrase"
    - "contrastive focus"

security:
  retrieved_text_is_untrusted: true
  allow_retrieved_tool_instructions: false
  require_verified_license: true
  quarantine_unknown_sources: true
  checksum_algorithm: sha256
  forbid_paths_outside_project_root: true
  log_document_text: false

writes:
  # Master switch. Every write-capable tool checks this AND requires confirm=true.
  allow_writes: false
  minimum_free_disk_gb: 20           # host is 91% full — refuse below this
