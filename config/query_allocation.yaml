rules:
  - Evaluation records are atomic; never chunk them.
  - Evaluation records must never enter ChromaDB or BM25.
  - No group may appear in both calibration and holdout.
  - Public holdout records must come from groups unused in calibration.
  - The holdout is frozen and SHA-256 hashed before its first scored run.
  - A holdout becomes historical regression data after it influences development.
