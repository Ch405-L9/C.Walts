#
# This file is the LICENSE AUDIT, not an ingestion manifest. Nothing listed here
# is embedded directly. The glossary that IS ingested
# (corpus/raw/glossary/prosody_glossary.md, source id `cwalts_prosody_glossary`
# in config/sources.yaml) is owner-authored text by BADGRTechnologies LLC, and
# every one of its entries names the source below that grounds it.
#
# The distinction matters and is the same one already applied to
# `cwalts_style_rules`: authoring a definition from the published record is not
# redistributing the record. Sources marked `approved` MAY additionally be quoted
# or redistributed; sources marked `quarantined` or `refused` may be CITED ONLY,
# and no bytes from them are reproduced in the corpus or in this repository.
#
# Verification standard is the one this project already applies in
# config/sources.yaml: an asserted license is not a verified license. For every
# `approved` entry below the license was read out of the retrieved artifact
# itself — the JATS <license> element — not from a publisher web page or a
# third-party claim. The snapshots are committed under
# docs/evidence/source-snapshots/ so the checksums are independently checkable:
#
#     sha256sum -c docs/evidence/source-snapshots/SHA256SUMS
#
# ACCESS DATE for every entry: 2026-08-01.

