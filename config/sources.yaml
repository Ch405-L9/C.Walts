  - id: cwalts_prosody_glossary
    title: C.Walts prosody glossary
    url: null
    path: corpus/raw/glossary/
    doc_type: glossary
    chunk_profile: glossary           # one entry per H2; a definition is never split
    license: Proprietary — BADGRTechnologies LLC
    license_url: null
    license_status: approved
    license_verified_on: 2026-08-01
    license_verified_by: owner-authored definitions; third-party sources cited, not copied
    commercial_use: permitted
    redistribution: prohibited
    attribution_required: false
    dialect: en-US
    register: reference
    notes: >
      ADDED 2026-08-01 for rc.2. Seventeen terms — prosody, textual prosody,
      acoustic prosody, ToBI, pitch accent, H*, boundary tone, L-L%, break index,
      intermediate phrase, intonational phrase, prominence, contrastive focus,
      information structure, breath group, cadence, sentence rhythm.

      The TEXT is owner-authored, which is why it needs no third-party license
      decision. The DEFINITIONS are grounded in seven CC BY 4.0 works whose
      licenses were verified in-band and whose checksums are recorded in
      config/glossary_sources.yaml; each entry names the source ids that ground
      it. Attribution is in NOTICE.

      The canonical ToBI labelling guidelines are restricted to non-commercial
      use and are REFUSED — see the register. No text from them is used here, and
      the ToBI entries are grounded in CC BY literature describing the system.

      This source is the ONLY answer to the exact prosody probes. It formerly
      shared that role with cwalts_evaluation_cases, which was removed from
      production at Gate 1 (v0.4.0-dev.2) — see below.

