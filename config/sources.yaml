# Source manifest. Ingestion REFUSES any source not listed here with a
# license_status of "approved". Unlisted or unapproved material is quarantined.
#
# A7 decision (owner, 2026-07-31): CMUdict only, for externally licensed material.
#
# NOTE ON SCOPE: CMUdict is a pronunciation dictionary — ARPAbet phonemes and
# 0/1/2 lexical stress digits. It answers "how is this word stressed". It contains
# no prose about rhythm, cadence, information flow, or emphasis, and therefore
# cannot on its own answer "make this sound natural". The owner_examples entry
# below is the corpus that actually carries flow knowledge; it requires no license
# decision because BADGRTechnologies LLC owns the material outright. It is enabled
# but empty — ingestion picks it up as soon as files are placed in its path.

version: 1
updated: 2026-07-31

sources:

