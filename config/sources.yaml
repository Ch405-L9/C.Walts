# ---------------------------------------------------------------------------
# WITHDRAWN FROM PRODUCTION — v0.4.0-dev.2, Gate 1
#
# cwalts_evaluation_cases (C.Walts evaluation prompts, EVAL-001…015 with their
# pass criteria) was an ingested source until Gate 1. It is now a REGRESSION
# FIXTURE and is never ingested again.
#
# Why: an evaluation prompt states the question and the pass criterion. Ingesting
# it let retrieval answer an evaluation query by returning the query — EVAL-005,
# EVAL-006, EVAL-007 and EVAL-009 each passed, at least in part, on the marker of
# their own prompt. A benchmark that can retrieve its own answer key measures
# nothing. The rc.2 mitigation (demote_doc_types) reordered the results but left
# the material in the collection and in the expectations.
#
# Where it went: eval/regression/source_documents/evaluation_prompts.md, moved
# with git mv so the history follows it. Original text, EVAL ids, pass criteria,
# historical notes and prior failure disclosures are preserved verbatim.
#
# What stops it coming back: ingestion refuses doc_type evaluation_case outright,
# source discovery refuses any path under eval/ or var/eval_sources/, and
# retrieval filters evaluation_case unconditionally — a caller-supplied filter
# cannot re-admit it. All three are asserted in tests/test_evaluation_boundary.py.
#
# This section is a record, not a source entry. Nothing here is ingestible.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# QUARANTINED — present for traceability. Ingestion will refuse all of these.
# Each requires an explicit owner decision plus independent license verification
# before its license_status may change.
# ---------------------------------------------------------------------------
quarantined:

  - id: buckeye
    title: Buckeye Corpus of Conversational Speech
    license_status: refused
    reason: Noncommercial use only; registration required. Incompatible with commercial use.

  - id: santa_barbara
    title: Santa Barbara Corpus of Spoken American English
    license_status: quarantined
    reason: >
      CC BY-ND 3.0. Whether transformed retrieval output constitutes a prohibited
      derivative is legally unresolved. Reference-only pending review.

  - id: common_voice
    title: Mozilla Common Voice
    license_status: quarantined
    reason: >
      CC0 asserted by owner README but NOT independently verified in the audit.
      Mozilla asks that datasets not be mirrored or redistributed. Not required
      for a textual-prosody build.

  - id: librispeech_libritts
    title: LibriSpeech / LibriTTS
    license_status: deferred
    reason: >
      CC BY 4.0 asserted but not independently verified. Read-audiobook speech is
      weak evidence for spontaneous conversational flow. Not in the first corpus.

  - id: opensmile
    title: openSMILE acoustic feature extraction
    license_status: refused
    reason: >
      Open-source distribution restricts commercial product use without a separate
      commercial license. Excluded from the commercial path entirely.
